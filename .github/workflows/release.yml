# Helium releases — binaires + .deb (consomme par install.sh)
# Declenche: git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publier (ex v0.1.0-alpha)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos
            arch: aarch64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build helium
        run: cargo build --release --locked -p helium-mesh --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="helium-${TAG}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/helium" "$STAGE/helium"
          chmod +x "$STAGE/helium"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          $STAGE = "helium-$TAG-windows-x86_64"
          New-Item -ItemType Directory -Path $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/helium.exe" "$STAGE/helium.exe"
          if (Test-Path README.md) { Copy-Item README.md $STAGE/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE $STAGE/ }
          Compress-Archive -Path "$STAGE/*" -DestinationPath "$STAGE.zip"
          echo "ASSET=$STAGE.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  deb:
    name: debian package
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb (x86_64)
        run: |
          cd helium-mesh
          cargo deb --no-build --no-strip || cargo deb
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: target/debian/*.deb

  publish:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, deb]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
