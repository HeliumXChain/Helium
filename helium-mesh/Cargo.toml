[package]
name = "helium-mesh"
version = "0.1.0-alpha13"
edition = "2021"
authors = ["Helium Team"]
description = "Private GPU sharing mesh network - persistent, social, enterprise-ready"
license = "MIT"
repository = "https://github.com/helium-network/helium-mesh"

[[bin]]
name = "helium"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Networking / WireGuard (Phase 2)
# wireguard-rs = "0.4"
# boringtun = { version = "0.6", optional = true }
# rust-crypto = "0.2"

# P2P Discovery (libp2p)
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "noise", "yamux", "kad", "identify", "ping", "mdns", "macros"] }
# libp2p-kad = "0.45"

# Cryptography / Identity
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
rand = "0.8"
x25519-dalek = "2.0.1"
sha2 = "0.10"
base64 = "0.21"
bs58 = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.30", features = ["bundled", "serde_json"] }

# TUI dashboard
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.30"

# CLI
clap = { version = "4.4", features = ["derive"], optional = true }
indicatif = "0.17"
colored = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "5.0"
config = "0.14"
once_cell = "1.19"

# HTTP API (for daemon)
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", optional = true }

# HTTP client (storage fetch)
reqwest = { version = "0.12", features = ["json"] }

# Container / Firecracker (Phase 2)
# firectl = { version = "0.4", optional = true }

[features]
default = ["daemon", "cli"]
cli = ["clap"]
daemon = ["axum", "tower", "tower-http"]
# wireguard = ["boringtun"]
# firecracker = ["firectl"]

[dev-dependencies]
tempfile = "3.9"

# Debian packaging (cargo deb) — `apt install ./helium-mesh_*.deb`
# Repo APT public (PPA/reprepro) = S2/v0.2, pas MVP.
[package.metadata.deb]
maintainer = "Helium Team"
copyright = "2026, Helium Team"
license-file = ["../LICENSE", "0"]
section = "net"
priority = "optional"
depends = "wireguard-tools, iproute2"
assets = [
  ["../target/release/helium", "usr/bin/", "755"],
  ["../ROADMAP.md", "usr/share/doc/helium-mesh/", "644"],
]
